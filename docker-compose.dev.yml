version: '3'
services:
  openaev-dev-pgsql:
    container_name: openaev-dev-pgsql
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: openaev
    ports:
      - "5432:5432"
    restart: unless-stopped
  openaev-dev-minio:
    container_name: openaev-dev-minio
    image: rustfs/rustfs:1.0.4
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_OBS_LOG_DIRECTORY: "" # logs to stdout instead of /logs
    volumes:
      # Named volume: the anonymous /data volume of a previous MinIO or Silo container is owned by root,
      # and RustFS (uid 10001) cannot start on it
      - rustfsdata:/data
    restart: unless-stopped
  openaev-dev-rabbitmq:
    container_name: openaev-dev-rabbitmq
    image: rabbitmq:4.4-management
    volumes:
      - type: bind
        source: rabbitmq.conf
        target: /etc/rabbitmq/rabbitmq.conf
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  rustfsdata:
